<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Bookscan</title>
  <meta name="description" content="Catalog your books by scanning their barcodes.">
  <meta name="theme-color" content="#131210">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/fraunces-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Apply the saved theme before first paint (dark is the default).
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('bookscan.theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Icon sprite (Lucide, ISC licence) -->
<svg xmlns="http://www.w3.org/2000/svg" hidden>
  <defs>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 7v10"/><path d="M12 7v10"/><path d="M17 7v10"/></symbol>
    <symbol id="i-barcode" viewBox="0 0 24 24"><path d="M3 5v14"/><path d="M8 5v14"/><path d="M12 5v14"/><path d="M17 5v14"/><path d="M21 5v14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></symbol>
    <symbol id="i-torch" viewBox="0 0 24 24"><path d="M12 13v1"/><path d="M17 2a1 1 0 0 1 1 1v4a3 3 0 0 1-.6 1.8l-.6.8A4 4 0 0 0 16 12v8a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-8a4 4 0 0 0-.8-2.4l-.6-.8A3 3 0 0 1 6 7V3a1 1 0 0 1 1-1z"/><path d="M6 6h12"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M10.94 5.274A7 7 0 0 1 15.71 10h1.79a4.5 4.5 0 0 1 4.222 6.057"/><path d="M18.796 18.81A4.5 4.5 0 0 1 17.5 19H9A7 7 0 0 1 5.79 5.78"/><path d="m2 2 20 20"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  </defs>
</svg>

<!-- Library -->
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1 class="wordmark">Book<em>scan</em></h1>
      <p class="count" id="count">&nbsp;</p>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="exportBtn" aria-label="Export as JSON" title="Export as JSON"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg></button>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
        <svg class="icon icon-light" aria-hidden="true"><use href="#i-sun"/></svg>
        <svg class="icon icon-dark" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <label class="search" id="searchWrap" hidden>
    <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
    <input type="search" id="search" placeholder="Search your shelf" autocomplete="off" enterkeyhint="search" aria-label="Search your shelf">
  </label>

  <main id="library" class="library" aria-live="polite"></main>

  <div class="empty" id="empty" hidden>
    <svg class="empty-art" viewBox="0 0 160 120" aria-hidden="true">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
        <rect class="art-muted" x="28" y="34" width="20" height="70" rx="3"/>
        <rect class="art-muted" x="52" y="22" width="24" height="82" rx="3"/>
        <rect class="art-accent" x="80" y="42" width="18" height="62" rx="3"/>
        <rect class="art-muted" x="107" y="30" width="22" height="76" rx="3" transform="rotate(12 118 68)"/>
        <path class="art-muted" d="M16 106h128"/>
        <path class="art-muted" d="M58 36h12M58 44h12"/>
        <path class="art-accent" d="M85 84v10M89 84v10M93 84v10"/>
      </g>
    </svg>
    <h2>Your shelf is empty</h2>
    <p>Scan the barcode on the back of a book and it lands here, with its title, author, publisher, date and page count.</p>
  </div>

</div>

<div class="dock">
  <button class="fab" id="scanBtn">
    <svg class="icon" aria-hidden="true"><use href="#i-scan"/></svg>
    <span>Scan a book</span>
  </button>
</div>

<!-- Scanner -->
<section class="scanner" id="scanner" data-mode="barcode" aria-label="Scanner" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="finder" id="finder" aria-hidden="true">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div class="laser"></div>
  </div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <div class="scan-msg" id="scanMsg" hidden>
    <svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg>
    <h2 id="scanMsgTitle"></h2>
    <p id="scanMsgBody"></p>
  </div>

  <div class="scan-top">
    <button class="glass-btn" id="scanClose" aria-label="Close scanner"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    <div class="scan-count" id="scanCount" hidden></div>
    <button class="glass-btn" id="torchBtn" aria-label="Flashlight" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-torch"/></svg></button>
  </div>

  <div class="scan-bottom">
    <div class="scan-card" id="scanCard" aria-live="polite"></div>
    <p class="scan-hint" id="scanHint"></p>
    <div class="scan-controls for-barcode">
      <button class="glass-pill" id="typeIsbnBtn"><svg class="icon" aria-hidden="true"><use href="#i-keyboard"/></svg><span>Type ISBN</span></button>
      <button class="glass-pill" id="noBarcodeBtn"><svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg><span>No barcode?</span></button>
    </div>
    <div class="scan-controls for-cover">
      <button class="glass-pill" id="backToBarcodeBtn"><svg class="icon" aria-hidden="true"><use href="#i-barcode"/></svg><span>Barcode</span></button>
      <button class="shutter" id="shutterBtn" aria-label="Photograph cover"><span></span></button>
      <button class="glass-pill" id="byHandBtn"><svg class="icon" aria-hidden="true"><use href="#i-pencil"/></svg><span>By hand</span></button>
    </div>
  </div>
  <input type="file" id="coverFile" accept="image/*" capture="environment" hidden>
</section>

<!-- Bottom sheet -->
<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
