<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Scripts only from Folio itself (WebAssembly for the barcode and ISBN readers); covers
       may come from any https address; lookups go to the catalogues and covers are fetched to
       straighten them. Not covered here (a header's job): frame-ancestors. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: data: blob:; font-src 'self'; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Folio</title>
  <meta name="description" content="Your books on lists: library, to read, reading, read, lent out. Scan a barcode to add one.">
  <meta name="theme-color" content="#100d2a">
  <meta name="color-scheme" content="dark light">
  <!-- The same as APP_VERSION in app.js (see pageInStep there); a deploy refuses them apart. -->
  <meta name="folio-version" content="2.22.0">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/fraunces-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Shown only at the address the app used to have -->
<div class="moved" id="moved" hidden></div>

<!-- Library -->
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <img class="mark" src="icons/mark-96.png" width="56" height="56" alt="">
      <div>
        <h1 class="wordmark">Folio</h1>
        <p class="count" id="count">&nbsp;</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
        <svg class="icon icon-light" aria-hidden="true"><use href="#i-sun"/></svg>
        <svg class="icon icon-dark" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <nav class="lists" id="lists" aria-label="Lists"></nav>

  <div class="tools" id="tools" hidden>
    <label class="search" id="searchWrap" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input type="search" id="search" placeholder="Search your shelf" autocomplete="off" enterkeyhint="search" aria-label="Search your shelf">
    </label>
    <button class="tool-btn" id="filterBtn" type="button" aria-label="Filter" title="Filter">
      <svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg><span data-t>Filter</span><b id="filterCount" hidden></b>
    </button>
    <button class="tool-btn" id="sortBtn" type="button" aria-label="Order" title="Order">
      <svg class="icon" aria-hidden="true"><use href="#i-sort"/></svg><span id="sortName"></span>
    </button>
    <button class="tool-btn" id="pickBtn" type="button" aria-label="Select" title="Select" aria-pressed="false">
      <svg class="icon" aria-hidden="true"><use href="#i-select"/></svg>
    </button>
    <div class="seg view-seg" id="viewSeg" role="group" aria-label="View">
      <button type="button" data-view="list" aria-label="List" title="List"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg></button>
      <button type="button" data-view="covers" aria-label="Covers" title="Covers"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg></button>
      <button type="button" data-view="cards" aria-label="Cards" title="Cards"><svg class="icon" aria-hidden="true"><use href="#i-cards"/></svg></button>
      <button type="button" data-view="stats" aria-label="Statistics" title="Statistics"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg></button>
    </div>
    <div class="chips active-filters" id="activeFilters" hidden></div>
  </div>

  <main id="library" class="library" aria-live="polite"></main>

  <div class="empty" id="empty" hidden>
    <svg class="empty-art" viewBox="0 0 160 120" aria-hidden="true">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
        <rect class="art-muted" x="28" y="34" width="20" height="70" rx="3"/>
        <rect class="art-muted" x="52" y="22" width="24" height="82" rx="3"/>
        <rect class="art-accent" x="80" y="42" width="18" height="62" rx="3"/>
        <rect class="art-muted" x="107" y="30" width="22" height="76" rx="3" transform="rotate(12 118 68)"/>
        <path class="art-muted" d="M16 106h128"/>
        <path class="art-muted" d="M58 36h12M58 44h12"/>
        <path class="art-accent" d="M85 84v10M89 84v10M93 84v10"/>
      </g>
    </svg>
    <h2 data-t>Your shelf is empty</h2>
    <p data-t>Scan the barcode on the back of a book and it lands here, with its title, author, publisher, date and page count.</p>
  </div>

</div>

<nav class="bar" id="bar" aria-label="Main"></nav>

<div class="dock">
  <button class="fab" id="addBtn">
    <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
    <span data-t>Add a book</span>
  </button>
  <div class="pick-bar" id="pickBar" role="toolbar" aria-label="Selected books" hidden></div>
</div>

<!-- Scanner -->
<section class="scanner" id="scanner" data-mode="barcode" aria-label="Scanner" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="finder" id="finder" aria-hidden="true">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div class="laser"></div>
  </div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <div class="scan-msg" id="scanMsg" hidden>
    <svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg>
    <h2 id="scanMsgTitle"></h2>
    <p id="scanMsgBody"></p>
  </div>

  <div class="scan-top">
    <button class="glass-btn" id="scanClose" aria-label="Close scanner"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    <button class="scan-target" id="scanTargetBtn" title="Choose the lists scanned books go on">
      <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>
      <span id="scanTargetName"></span>
      <b class="scan-count" id="scanCount" hidden></b>
    </button>
    <button class="glass-btn" id="torchBtn" aria-label="Flashlight" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-torch"/></svg></button>
  </div>

  <div class="scan-bottom">
    <div class="scan-card" id="scanCard" aria-live="polite"></div>
    <p class="scan-hint" id="scanHint"></p>
    <div class="scan-controls for-barcode">
      <button class="glass-pill" id="typeIsbnBtn"><svg class="icon" aria-hidden="true"><use href="#i-keyboard"/></svg><span data-t>Type ISBN</span></button>
      <button class="glass-pill" id="noBarcodeBtn"><svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg><span data-t>No barcode?</span></button>
    </div>
    <div class="scan-controls for-cover">
      <button class="glass-pill" id="backToBarcodeBtn"><svg class="icon" aria-hidden="true"><use href="#i-barcode"/></svg><span data-t>Barcode</span></button>
      <button class="shutter" id="shutterBtn" aria-label="Photograph cover"><span></span></button>
      <button class="glass-pill" id="byHandBtn"><svg class="icon" aria-hidden="true"><use href="#i-pencil"/></svg><span data-t>By hand</span></button>
    </div>
  </div>
  <input type="file" id="coverFile" accept="image/*" capture="environment" hidden>
</section>

<!-- Bottom sheet -->
<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
